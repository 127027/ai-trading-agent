name: Autonomous V6 clean six-agent ten-day research

on:
  push:
    branches: [autonomous-agentic-v6-clean]
    paths:
      - ".github/workflows/walk-forward-research.yml"
      - "research/ten_day_challenge/**"
      - "runtime/user_data/strategies/candidates/**"
      - "runtime/user_data/hyperopts/**"
      - "tests/research/**"
  workflow_dispatch:
    inputs:
      segment:
        description: Continuous research segment
        required: true
        default: "1"
        type: choice
        options: ["1", "2"]

permissions:
  contents: write
  actions: write

concurrency:
  group: autonomous-v6-clean-${{ github.ref }}
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      DATA_DIR: ${{ github.workspace }}/.research-data/binance
      SEGMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.segment || '1' }}

    steps:
      - name: Check out V6 clean branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install frozen environment and Hyperopt extra
        run: |
          uv sync --frozen --all-extras --python 3.12
          uv pip install --python .venv/bin/python "freqtrade[hyperopt]==2026.7"

      - name: Restore historical Binance cache
        id: market-cache
        uses: actions/cache/restore@v4
        with:
          path: .research-data/binance
          key: binance-spot-20220901-20260901-15m-5m-mixed-ts-v2

      - name: Download four years of public Binance data
        id: download-data
        if: steps.market-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf "$DATA_DIR"
          .venv/bin/python research/ten_day_challenge/binance_vision.py \
            --pairs BTC/USDT ETH/USDT SOL/USDT BNB/USDT XRP/USDT ADA/USDT \
            --timeframes 15m 5m \
            --start 2022-09-01 --end 2026-09-01 --data-dir "$DATA_DIR"

      - name: Save historical Binance cache
        if: steps.market-cache.outputs.cache-hit != 'true' && steps.download-data.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .research-data/binance
          key: binance-spot-20220901-20260901-15m-5m-mixed-ts-v2

      - name: Validate Germany retail research policy
        run: |
          .venv/bin/python research/ten_day_challenge/jurisdiction_policy.py \
            --root "$GITHUB_WORKSPACE"

      - name: Validate V6 clean implementation
        run: |
          .venv/bin/python -m pytest \
            tests/research/test_ten_day_challenge.py \
            tests/research/test_walk_forward.py \
            tests/research/test_agentic_evolution.py \
            tests/research/test_binance_vision.py \
            tests/research/test_margin_model.py \
            tests/research/test_signal_learning.py \
            tests/research/test_agent_quality.py
          .venv/bin/ruff check \
            research/ten_day_challenge/agentic_walk_forward.py \
            research/ten_day_challenge/agentic_walk_forward_v4.py \
            research/ten_day_challenge/agentic_walk_forward_v5_1.py \
            research/ten_day_challenge/agent_quality.py \
            research/ten_day_challenge/margin_model.py \
            research/ten_day_challenge/signal_learning.py \
            research/ten_day_challenge/evolution.py \
            research/ten_day_challenge/walk_forward.py \
            research/ten_day_challenge/rolling_windows.py \
            research/ten_day_challenge/council.py \
            research/ten_day_challenge/jurisdiction_policy.py \
            runtime/user_data/hyperopts/TenDayChallengeLoss.py \
            runtime/user_data/strategies/candidates/TenDayAdaptiveV2.py \
            tests/research/test_agentic_evolution.py \
            tests/research/test_margin_model.py \
            tests/research/test_signal_learning.py \
            tests/research/test_agent_quality.py

      - name: Run five clean V6 blind experiments
        id: blind-runs
        run: |
          git config user.name "agentic-research-agent"
          git config user.email "agentic-research-agent@users.noreply.github.com"

          for SLOT in 1 2 3 4 5; do
            echo "=== V6 clean six-raster run $SLOT/5 ==="
            .venv/bin/python research/ten_day_challenge/agentic_walk_forward_v5_1.py \
              --root "$GITHUB_WORKSPACE" \
              --data-dir "$DATA_DIR" \
              --python .venv/bin/python \
              --freqtrade .venv/bin/freqtrade \
              --max-raster-restarts 6

            .venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path(
              'research/ten_day_challenge/walk-forward-state.json'
          ).read_text())
          assert state['agent_generation'] == 'contextual-signal-v6-clean'
          assert state['inherited_run_state'] is False
          assert state['inherited_research_memory'] is False
          assert int(state['run_count']) >= 1
          if int(state['run_count']) == 1:
              assert int(state['hit_count']) + int(state['miss_count']) == 1
          PY

            git add -A \
              research/ten_day_challenge/walk-forward-state.json \
              research/ten_day_challenge/research-memory.json \
              research/ten_day_challenge/results/agentic-walk-forward \
              research/ten_day_challenge/agentic-champion \
              runtime/user_data/strategies/candidates/TenDayAdaptiveV2.json
            if ! git diff --cached --quiet; then
              git commit -m "research: V6 clean checkpoint segment ${SEGMENT} slot ${SLOT} [skip ci]"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
          done

      - name: Continue next V6 clean batch
        if: success()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          .venv/bin/python research/ten_day_challenge/continue_research.py \
            --repository "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            --current-segment "$SEGMENT" \
            --workflow walk-forward-research.yml
