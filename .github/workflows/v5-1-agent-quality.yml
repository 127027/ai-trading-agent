name: Validate V5.1 six-agent quality

on:
  push:
    branches: [autonomous-agentic-v5-1-meta]
    paths:
      - "research/ten_day_challenge/agent_quality.py"
      - "research/ten_day_challenge/agentic_walk_forward_v5_1.py"
      - "tests/research/test_agent_quality.py"
      - ".github/workflows/v5-1-agent-quality.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test tools
        run: python -m pip install pytest ruff
      - name: Validate strengthened agent responsibilities
        run: |
          python -m pytest tests/research/test_agent_quality.py
          ruff check research/ten_day_challenge/agent_quality.py research/ten_day_challenge/agentic_walk_forward_v5_1.py tests/research/test_agent_quality.py
